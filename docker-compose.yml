services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_os}
      POSTGRES_USER: ${POSTGRES_USER:-home_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-home_os} -d ${POSTGRES_DB:-home_os}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    env_file: .env
    networks:
      - default
      - pangolin
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
volumes:
  postgres_data:
  frontend_node_modules:
networks:
  default:
  pangolin:
    external: true
    name: pangolin
